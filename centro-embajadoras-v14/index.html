<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro de Embajadoras · Menopausia Dichosa®</title>
<meta name="description" content="Tu espacio para aprender, acompañar, compartir y multiplicar con Menopausia Dichosa®.">
<meta property="og:title" content="Centro de Embajadoras · Menopausia Dichosa®">
<meta property="og:description" content="Tu camino. Tu causa. Tu impacto. Aprende, acompaña, comparte y multiplica.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mokabral73-hue.github.io/AlianzasVillanos/centro-embajadoras-v14/">
<meta property="og:image" content="https://mokabral73-hue.github.io/AlianzasVillanos/centro-embajadoras-v14/portada-centro-embajadoras.png">
<meta property="og:image:width" content="1536">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="Centro de Embajadoras · Menopausia Dichosa®">

<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ee}#centro{display:block;width:100%;height:100%;border:0;background:#f7f4ee}</style>
</head>
<body>
<iframe id="centro" src="app.html" title="Centro de Embajadoras · Menopausia Dichosa®"></iframe>
<script>
const iframe=document.getElementById('centro');
function storage(){return iframe.contentWindow.localStorage;}
function installRecognition(){try{const win=iframe.contentWindow,doc=iframe.contentDocument;win.showRecognition=function(){doc.querySelectorAll('.station').forEach(x=>x.classList.remove('active'));const recognition=doc.getElementById('recognition');recognition.classList.add('active');const nombre=(doc.getElementById('nombre')&&doc.getElementById('nombre').value)||'Embajadora';recognition.innerHTML='<div class="box" style="text-align:center;max-width:760px;margin:18px auto;border:2px solid #8fa578"><div class="tulip">🌷</div><h2>¡Felicidades, '+nombre+'!</h2><p style="font-size:18px;margin-bottom:4px"><b>Has completado tu Ruta de Activación como</b></p><h2 style="color:#6f7b5a;margin-top:4px">Embajadora de Menopausia Dichosa®</h2><p>Has recorrido las seis estaciones y ya tienes herramientas para llevar la causa a otras mujeres.</p><div style="margin:22px 0;padding:15px;border-radius:16px;background:#f4f7ef;font-weight:800;line-height:1.9">DESCUBRE ✓ → CONECTA ✓ → ACOMPAÑA ✓ → COMPARTE ✓ → ACTÍVATE ✓ → MULTIPLICA ✓</div><div class="mission" style="text-align:center"><b>💗 Tu ruta no termina aquí.<br>Ahora comienza tu impacto como Embajadora.</b></div><button class="btn" type="button" onclick="show(\'home\')">VOLVER AL CENTRO DE EMBAJADORAS →</button></div>';storage().setItem('md_station','6');iframe.contentWindow.scrollTo(0,0)}}catch(e){}}
function goalModal(nextLevel,nextStation,title,text){
  try{
    const doc=iframe.contentDocument;
    const old=doc.getElementById('goalChangeModal');if(old)old.remove();
    const overlay=doc.createElement('div');overlay.id='goalChangeModal';
    overlay.style.cssText='position:fixed;inset:0;background:rgba(55,58,52,.48);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px';
    overlay.innerHTML='<div style="background:#fffdf9;max-width:560px;width:100%;border-radius:24px;padding:24px;box-shadow:0 18px 55px rgba(0,0,0,.22);text-align:center"><div style="font-size:40px">🌷</div><div style="font-size:12px;letter-spacing:.12em;font-weight:900;color:#6f7b5a">TU RUTA, TU DECISIÓN</div><h2 style="margin-bottom:8px">'+title+'</h2><p style="font-size:17px;color:#5f655d">'+text+'</p><div style="background:#f4f7ef;border-radius:16px;padding:14px;margin:18px 0"><b>Al continuar, estás eligiendo ampliar el objetivo que seleccionaste al comenzar.</b></div><button id="keepGoal" type="button" style="border:0;background:#ece6dd;color:#3f463c;font-weight:900;border-radius:999px;padding:12px 17px;margin:5px;cursor:pointer">POR AHORA ME QUEDO AQUÍ</button><button id="expandGoal" type="button" style="border:0;background:#6f7b5a;color:#fff;font-weight:900;border-radius:999px;padding:12px 17px;margin:5px;cursor:pointer">SÍ, QUIERO AMPLIAR MI OBJETIVO →</button></div>';
    doc.body.appendChild(overlay);
    doc.getElementById('keepGoal').onclick=()=>overlay.remove();
    doc.getElementById('expandGoal').onclick=()=>{storage().setItem('md_level',nextLevel);overlay.remove();iframe.contentWindow.goStation(nextStation)};
  }catch(e){}
}
function updateBoundaryButtons(){
  try{
    const doc=iframe.contentDocument,s=storage(),level=s.getItem('md_level')||'';
    const b2=doc.getElementById('next2'),b4=doc.getElementById('next4');
    if(b2)b2.textContent=level==='conocer'?'CAMBIAR MI OBJETIVO Y SEGUIR →':'Ir a ACOMPAÑA →';
    if(b4)b4.textContent=(level==='conocer'||level==='acompanar')?'CAMBIAR MI OBJETIVO Y SEGUIR →':'Ir a ACTÍVATE →';
  }catch(e){}
}
function wire(){
  try{
    const doc=iframe.contentDocument;installRecognition();
    const stop2=doc.getElementById('stop2'),stop4=doc.getElementById('stop4');
    if(stop2){stop2.innerHTML='<b>🌱 Cumpliste el objetivo que elegiste al comenzar.</b><p style="margin:8px 0 0">Puedes quedarte aquí por ahora. Si quieres continuar a ACOMPAÑA, primero te pediremos confirmar que deseas ampliar tu objetivo.</p>'}
    if(stop4){stop4.innerHTML='<b>💗 Cumpliste el objetivo que elegiste al comenzar.</b><p style="margin:8px 0 0">Puedes quedarte aquí por ahora. Si quieres continuar a ACTÍVATE, primero te pediremos confirmar que deseas ampliar tu objetivo.</p>'}
    doc.addEventListener('click',(ev)=>{
      const btn=ev.target.closest?ev.target.closest('#next2,#next4'):null;if(!btn)return;
      const current=storage().getItem('md_level')||'';
      if(btn.id==='next2'&&current==='conocer'){
        ev.preventDefault();ev.stopImmediatePropagation();
        goalModal('acompanar',3,'Ya cumpliste tu primer objetivo','Elegiste conocer y aprender. Para pasar a ACOMPAÑA vas a asumir un nuevo objetivo: aprender a acompañar a otras mujeres.');
        return;
      }
      if(btn.id==='next4'&&(current==='conocer'||current==='acompanar')){
        ev.preventDefault();ev.stopImmediatePropagation();
        goalModal('crecer',5,'Estás lista para decidir tu siguiente nivel','Hasta aquí cumpliste tu objetivo de acompañamiento. Para pasar a ACTÍVATE vas a elegir involucrarte activamente y ayudar a crecer la causa.');
        return;
      }
    },true);
    doc.addEventListener('change',()=>setTimeout(updateBoundaryButtons,40),true);
    doc.addEventListener('click',()=>setTimeout(updateBoundaryButtons,80),false);
    updateBoundaryButtons();
  }catch(e){}
}
iframe.addEventListener('load',wire);
</script>
</body>
</html>
