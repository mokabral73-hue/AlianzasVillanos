<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro de Embajadoras · Menopausia Dichosa®</title>
<meta name="description" content="Tu espacio para aprender, acompañar, compartir y multiplicar con Menopausia Dichosa®.">
<meta property="og:title" content="Centro de Embajadoras · Menopausia Dichosa®">
<meta property="og:description" content="Tu camino. Tu causa. Tu impacto. Aprende, acompaña, comparte y multiplica.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mokabral73-hue.github.io/AlianzasVillanos/centro-embajadoras-v14/">
<meta property="og:image" content="https://mokabral73-hue.github.io/AlianzasVillanos/centro-embajadoras-v14/portada-centro-embajadoras.png">
<meta property="og:image:width" content="1536">
<meta property="og:image:height" content="1024">
<meta property="og:image:alt" content="Centro de Embajadoras · Menopausia Dichosa®">
<meta name="twitter:card" content="summary_large_image">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ee}#centro{display:block;width:100%;height:100%;border:0;background:#f7f4ee}.sync-beacon{position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none}</style>
</head>
<body>
<iframe id="centro" src="app.html" title="Centro de Embajadoras · Menopausia Dichosa®"></iframe>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxlB1U5wy6tUb0oFOujY9qxWw6_b8XFzD4pHVZ7uoGdTG1ahOsnVdjLoTavitI7lKamcw/exec';
const iframe=document.getElementById('centro');
let timer=null,lastFingerprint='';
function storage(){return iframe.contentWindow.localStorage;}
function ambassadorId(){const s=storage();let id=s.getItem('md_ambassador_id');if(!id){id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'emb-'+Date.now()+'-'+Math.random().toString(36).slice(2);s.setItem('md_ambassador_id',id)}return id}
function levelLabel(v){return v==='conocer'?'🌱 Conocer y aprender':v==='acompanar'?'💗 Aprender a acompañar':v==='crecer'?'⭐ Ruta completa':''}
function stationLabel(n){return ['DESCUBRE','CONECTA','ACOMPAÑA','COMPARTE','ACTÍVATE','MULTIPLICA'][Math.max(0,Math.min(5,(Number(n)||1)-1))]}
function value(id){const el=iframe.contentDocument.getElementById(id);return el?String(el.value||'').trim():''}
function accompaniedCount(){const cards=[...iframe.contentDocument.querySelectorAll('#people .person')];return cards.filter(card=>{const input=card.querySelector('input');return input&&String(input.value||'').trim()}).length}
function collect(){const s=storage();return {id:ambassadorId(),nombre:value('nombre')||s.getItem('md_nombre')||'',ciudad:value('ciudad')||s.getItem('md_ciudad')||'',nivel:levelLabel(s.getItem('md_level')||''),estacion:stationLabel(s.getItem('md_station')||1),estado:'Activa',acompanadas:accompaniedCount(),invitadas:Number(value('invitadas')||s.getItem('md_invitadas')||0),nuevas:Number(value('nuevas')||s.getItem('md_nuevas')||0)}}
function sendObject(p){try{const qs=new URLSearchParams();Object.entries(p).forEach(([k,v])=>qs.set(k,String(v)));qs.set('_t',String(Date.now()));const f=document.createElement('iframe');f.className='sync-beacon';f.setAttribute('aria-hidden','true');f.src=SCRIPT_URL+'?'+qs.toString();document.body.appendChild(f);setTimeout(()=>{try{f.remove()}catch(e){}},6000)}catch(e){}}
function submitProgress(force=false){try{const p=collect();if(!p.nombre||!p.nivel)return;const fingerprint=JSON.stringify(p);if(!force&&fingerprint===lastFingerprint)return;lastFingerprint=fingerprint;sendObject(p)}catch(e){}}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>submitProgress(false),700)}
function installRecognition(){try{const win=iframe.contentWindow,doc=iframe.contentDocument;win.showRecognition=function(){doc.querySelectorAll('.station').forEach(x=>x.classList.remove('active'));const recognition=doc.getElementById('recognition');recognition.classList.add('active');const nombre=(doc.getElementById('nombre')&&doc.getElementById('nombre').value)||'Embajadora';recognition.innerHTML='<div class="box" style="text-align:center;max-width:760px;margin:18px auto;border:2px solid #8fa578"><div class="tulip">🌷</div><h2>¡Felicidades, '+nombre+'!</h2><p style="font-size:18px;margin-bottom:4px"><b>Has completado tu Ruta de Activación como</b></p><h2 style="color:#6f7b5a;margin-top:4px">Embajadora de Menopausia Dichosa®</h2><p>Has recorrido las seis estaciones y ya tienes herramientas para llevar la causa a otras mujeres.</p><div style="margin:22px 0;padding:15px;border-radius:16px;background:#f4f7ef;font-weight:800;line-height:1.9">DESCUBRE ✓ → CONECTA ✓ → ACOMPAÑA ✓ → COMPARTE ✓ → ACTÍVATE ✓ → MULTIPLICA ✓</div><div class="mission" style="text-align:center"><b>💗 Tu ruta no termina aquí.<br>Ahora comienza tu impacto como Embajadora.</b></div><button class="btn" type="button" onclick="show(\'home\')">VOLVER AL CENTRO DE EMBAJADORAS →</button></div>';storage().setItem('md_station','6');setTimeout(()=>submitProgress(true),300);iframe.contentWindow.scrollTo(0,0)}}catch(e){}}
function wire(){try{const doc=iframe.contentDocument;installRecognition();doc.addEventListener('input',schedule,true);doc.addEventListener('change',schedule,true);doc.addEventListener('click',(ev)=>{const btn=ev.target.closest?ev.target.closest('#next2,#next4'):null;if(btn){const s=storage();const current=s.getItem('md_level')||'';if(btn.id==='next2'&&current==='conocer')s.setItem('md_level','acompanar');if(btn.id==='next4'&&(current==='conocer'||current==='acompanar'))s.setItem('md_level','crecer')}setTimeout(schedule,250)},true);const stop2=doc.getElementById('stop2'),stop4=doc.getElementById('stop4');if(stop2&&!stop2.dataset.note){stop2.dataset.note='1';stop2.insertAdjacentHTML('beforeend','<p style="margin:8px 0 0">Si quieres seguir avanzando, pulsa <b>Ir a ACOMPAÑA</b> y ampliaremos tu ruta.</p>')}if(stop4&&!stop4.dataset.note){stop4.dataset.note='1';stop4.insertAdjacentHTML('beforeend','<p style="margin:8px 0 0">Si quieres seguir avanzando, pulsa <b>Ir a ACTÍVATE</b> y ampliaremos tu ruta.</p>')}setTimeout(()=>submitProgress(true),900);if(new URLSearchParams(location.search).get('sync_test')==='3'){setTimeout(()=>sendObject({id:'SYNC-IFRAME-'+Date.now(),nombre:'PRUEBA SYNC IFRAME',ciudad:'Diagnóstico',nivel:'⭐ Ruta completa',estacion:'DESCUBRE',estado:'Prueba técnica',acompanadas:0,invitadas:0,nuevas:0}),1200)}}catch(e){}}
iframe.addEventListener('load',wire);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')submitProgress(false)});
window.addEventListener('pagehide',()=>submitProgress(false));
</script>
</body>
</html>
