<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ee}#centro{display:block;width:100%;height:100%;border:0;background:#f7f4ee}#syncframe{display:none}
</style>
</head>
<body>
<iframe id="centro" src="app.html" title="Centro de Embajadoras · Menopausia Dichosa®"></iframe>
<iframe id="syncframe" name="syncframe" title="Sincronización"></iframe>
<form id="syncform" method="post" target="syncframe" action="https://script.google.com/macros/s/AKfycbxlB1U5wy6tUb0oFOujY9qxWw6_b8XFzD4pHVZ7uoGdTG1ahOsnVdjLoTavitI7lKamcw/exec" style="display:none"></form>
<script>
const iframe=document.getElementById('centro');
const syncform=document.getElementById('syncform');
let timer=null,lastFingerprint='';
function storage(){return iframe.contentWindow.localStorage;}
function ambassadorId(){const s=storage();let id=s.getItem('md_ambassador_id');if(!id){id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'emb-'+Date.now()+'-'+Math.random().toString(36).slice(2);s.setItem('md_ambassador_id',id)}return id}
function levelLabel(v){return v==='conocer'?'🌱 Conocer y aprender':v==='acompanar'?'💗 Aprender a acompañar':v==='crecer'?'⭐ Ruta completa':''}
function stationLabel(n){return ['DESCUBRE','CONECTA','ACOMPAÑA','COMPARTE','ACTÍVATE','MULTIPLICA'][Math.max(0,Math.min(5,(Number(n)||1)-1))]}
function value(id){const el=iframe.contentDocument.getElementById(id);return el?String(el.value||'').trim():''}
function accompaniedCount(){const cards=[...iframe.contentDocument.querySelectorAll('#people .person')];return cards.filter(card=>{const input=card.querySelector('input');return input&&String(input.value||'').trim()}).length}
function collect(){const s=storage();return {id:ambassadorId(),nombre:value('nombre')||s.getItem('md_nombre')||'',ciudad:value('ciudad')||s.getItem('md_ciudad')||'',nivel:levelLabel(s.getItem('md_level')||''),estacion:stationLabel(s.getItem('md_station')||1),estado:'Activa',acompanadas:accompaniedCount(),invitadas:Number(value('invitadas')||s.getItem('md_invitadas')||0),nuevas:Number(value('nuevas')||s.getItem('md_nuevas')||0)}}
function submitProgress(force=false){try{const p=collect();if(!p.nombre||!p.nivel)return;const fingerprint=JSON.stringify(p);if(!force&&fingerprint===lastFingerprint)return;lastFingerprint=fingerprint;syncform.innerHTML='';Object.entries(p).forEach(([k,v])=>{const input=document.createElement('input');input.type='hidden';input.name=k;input.value=String(v);syncform.appendChild(input)});syncform.submit()}catch(e){}}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>submitProgress(false),700)}
function wire(){try{const doc=iframe.contentDocument;doc.addEventListener('input',schedule,true);doc.addEventListener('change',schedule,true);doc.addEventListener('click',(ev)=>{const btn=ev.target.closest?ev.target.closest('#next2,#next4'):null;if(btn){const s=storage();const current=s.getItem('md_level')||'';if(btn.id==='next2'&&current==='conocer')s.setItem('md_level','acompanar');if(btn.id==='next4'&&(current==='conocer'||current==='acompanar'))s.setItem('md_level','crecer')}setTimeout(schedule,250)},true);const stop2=doc.getElementById('stop2'),stop4=doc.getElementById('stop4');if(stop2&&!stop2.dataset.note){stop2.dataset.note='1';stop2.insertAdjacentHTML('beforeend','<p style="margin:8px 0 0">Si quieres seguir avanzando, pulsa <b>Ir a ACOMPAÑA</b> y ampliaremos tu ruta.</p>')}if(stop4&&!stop4.dataset.note){stop4.dataset.note='1';stop4.insertAdjacentHTML('beforeend','<p style="margin:8px 0 0">Si quieres seguir avanzando, pulsa <b>Ir a ACTÍVATE</b> y ampliaremos tu ruta.</p>')}setTimeout(()=>submitProgress(true),900)}catch(e){}}
iframe.addEventListener('load',wire);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')submitProgress(false)});
window.addEventListener('pagehide',()=>submitProgress(false));
</script>
</body>
</html>
